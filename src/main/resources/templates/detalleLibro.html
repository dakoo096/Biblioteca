<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle del libro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background-color: #F4F7F6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 16px;
        }
        .btn-dark {
            background-color: #2F855A;
            border-color: #2F855A;
        }

        .btn-dark:hover {
            background-color: #276749;
            border-color: #276749;
        }

    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <div class="text-center mb-3">
            <span style="font-size: 3rem;">📘</span>
        </div>
        <div class="text-center py-4 mb-4"
             style="background: linear-gradient(135deg, #4F6D64, #3E5F57); border-radius: 0 0 24px 24px;">
            <h1 class="text-white fw-semibold">Detalle del libro</h1>
        </div>

        <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item">
                <strong>ID:</strong>
                <span th:text="${libro.idLibro}"></span>
            </li>
            <li class="list-group-item">
                <strong>Título:</strong>
                <span th:text="${libro.titulo}"></span>
            </li>
            <li class="list-group-item">
                <strong>Autor:</strong>
                <span th:text="${libro.autor}"></span>
            </li>
            <li class="list-group-item">
                <strong>ISBN:</strong>
                <span th:text="${libro.isbn}"></span>
            </li>
        </ul>


        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                ⬅ Volver
            </a>

            <a
                    th:href="@{/editarLibro/{id}(id=${libro.idLibro})}"
                    class="btn btn-dark px-4"
            >
                ✏️ Editar libro
            </a>
        </div>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SaaS - Editar Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="../static/css/custom.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

    <!-- Include Reusable Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4">

        <div class="form-card">
            
            <div class="form-header">
                <div class="form-header-icon" style="background: #eef2ff; color: #4f46e5;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <h2>Editar Usuario</h2>
                <p>Modifica la información del usuario <span class="badge-isbn" th:text="'#' + ${usuario.id}">#1</span></p>
            </div>

            <form th:action="@{/usuarios/actualizar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="custom-input-group">
                    <label for="nombre"><i class="bi bi-person text-primary"></i> Nombre</label>
                    <div class="input-with-icon">
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control-custom" placeholder="Ej. Ana" required>
                        <i class="bi bi-type input-icon"></i>
                    </div>
                </div>

                <div class="custom-input-group">
                    <label for="apellido"><i class="bi bi-person text-primary"></i> Apellido</label>
                    <div class="input-with-icon">
                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control-custom" placeholder="Ej. García" required>
                        <i class="bi bi-type input-icon"></i>
                    </div>
                </div>

                <div class="custom-input-group">
                    <label for="email"><i class="bi bi-envelope text-primary"></i> Correo Electrónico</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" th:field="*{email}" class="form-control-custom" placeholder="ana.garcia@email.com" required>
                        <i class="bi bi-at input-icon"></i>
                    </div>
                </div>

                <div class="custom-input-group mb-3">
                    <label for="rol"><i class="bi bi-shield-check text-primary"></i> Rol de Sistema</label>
                    <select id="rol" th:field="*{rol}" class="form-select" required>
                        <option value="ROLE_LECTOR">📖 Lector / Usuario Común</option>
                        <option value="ROLE_ADMIN">👑 Administrador</option>
                    </select>
                </div>

                <div class="custom-input-group mb-3">
                    <label for="password"><i class="bi bi-key text-primary"></i> Nueva Contraseña (Dejar en blanco para no cambiar)</label>
                    <div class="input-with-icon">
                        <input type="password" id="password" th:field="*{password}" class="form-control-custom" placeholder="••••••••">
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>

                <div class="custom-input-group">
                    <label for="telefono"><i class="bi bi-telephone text-primary"></i> Teléfono</label>
                    <div class="input-with-icon">
                        <input type="text" id="telefono" th:field="*{telefono}" class="form-control-custom" placeholder="+54 11 1234-5678">
                        <i class="bi bi-phone input-icon"></i>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-3 mt-4 pt-2">
                    <a th:href="@{/usuarios}" class="btn-secondary-custom"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn-primary-custom"><i class="bi bi-check-circle"></i> Actualizar Usuario</button>
                </div>

            </form>

        </div>

    </main>
</body>
</html>

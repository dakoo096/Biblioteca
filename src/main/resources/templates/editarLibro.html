<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Libro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >

    <style>
        body {
            background-color: #F4F7F6;
            font-family: 'Segoe UI', sans-serif;
            color: #1F2933;
        }

        .hero {
            background: linear-gradient(135deg, #4F6D64, #3E5F57);
            border-radius: 0 0 24px 24px;
        }

        .hero h1 {
            color: #ffffff;
            font-weight: 600;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 500;
        }

        .btn-primary {
            background-color: #2F855A;
            border-color: #2F855A;
        }

        .btn-primary:hover {
            background-color: #276749;
            border-color: #276749;
        }
        .btn-dark {
            background-color: #2F855A;
            border-color: #2F855A;
        }

        .btn-dark:hover {
            background-color: #276749;
            border-color: #276749;
        }


    </style>
</head>

<body>

<div class="hero text-center py-4 mb-5">
    <h1>Editar Libro</h1>
</div>

<div class="container">
    <form
            th:action="@{/actualizarLibro}"
            method="post"
            class="form-card mx-auto"
            style="max-width: 500px;"
    >
        <input
                type="hidden"
                name="idLibro"
                th:value="${libro.idLibro}"
        >

        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    class="form-control"
                    th:value="${libro.titulo}"
                    required
            >
        </div>

        <div class="mb-3">
            <label for="autor" class="form-label">Autor</label>
            <input
                    type="text"
                    id="autor"
                    name="autor"
                    class="form-control"
                    th:value="${libro.autor}"
                    required
            >
        </div>

        <div class="mb-4">
            <label for="isbn" class="form-label">ISBN</label>
            <input
                    type="text"
                    id="isbn"
                    name="isbn"
                    class="form-control"
                    th:value="${libro.isbn}"
                    required
            >
        </div>

        <div class="text-center d-flex justify-content-center gap-3">
            <a
                    th:href="@{/}"
                    class="btn btn-outline-secondary px-4"
                    onclick="return confirm('¿Seguro que querés volver sin guardar los cambios?')"
            >
                ⬅ Volver
            </a>


            <button type="submit" class="btn btn-dark px-4">
                💾 Actualizar
            </button>
        </div>

    </form>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SaaS - Editar Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="../static/css/custom.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/}">
                <div class="brand-logo-wrapper"><i class="bi bi-bank"></i></div>
                <div>
                    <span class="brand-title d-block">Biblioteca SaaS</span>
                    <small class="text-muted d-block" style="font-size: 0.75rem; margin-top: -3px;">Gestión Bibliotecaria</small>
                </div>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/libros}" class="btn-secondary-custom"><i class="bi bi-arrow-left"></i> Volver a catálogo</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="form-card" style="max-width: 680px;">
            
            <div class="form-header">
                <div class="form-header-icon" style="background: #e0f2fe; color: #0284c7;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <h2>Editar Libro</h2>
                <p>Modifica la información del ejemplar <span class="badge-isbn" th:text="'#' + ${libro.id}">#1</span></p>
            </div>

            <form th:action="@{/libros/actualizar}" th:object="${libro}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="col-md-8">
                        <div class="custom-input-group">
                            <label for="titulo"><i class="bi bi-book text-primary"></i> Título del libro</label>
                            <div class="input-with-icon">
                                <input type="text" id="titulo" th:field="*{titulo}" class="form-control-custom" required>
                                <i class="bi bi-type input-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="custom-input-group">
                            <label for="isbn"><i class="bi bi-barcode text-primary"></i> Código ISBN</label>
                            <div class="input-with-icon">
                                <input type="text" id="isbn" th:field="*{isbn}" class="form-control-custom" required>
                                <i class="bi bi-hash input-icon"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="custom-input-group">
                            <label for="autorId"><i class="bi bi-person text-primary"></i> Autor</label>
                            <select id="autorId" th:field="*{autorId}" class="form-select form-control-custom" required>
                                <option value="">-- Selecciona un autor --</option>
                                <option th:each="aut : ${autores}" th:value="${aut.id}" th:text="${aut.nombreCompleto}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="custom-input-group">
                            <label for="categoriaId"><i class="bi bi-tags text-primary"></i> Categoría</label>
                            <select id="categoriaId" th:field="*{categoriaId}" class="form-select form-control-custom" required>
                                <option value="">-- Selecciona una categoría --</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="custom-input-group">
                            <label for="editorialId"><i class="bi bi-building text-primary"></i> Editorial</label>
                            <select id="editorialId" th:field="*{editorialId}" class="form-select form-control-custom" required>
                                <option value="">-- Selecciona una editorial --</option>
                                <option th:each="ed : ${editoriales}" th:value="${ed.id}" th:text="${ed.nombre}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="custom-input-group">
                            <label for="cantidadTotal"><i class="bi bi-boxes text-primary"></i> Ejemplares Totales</label>
                            <input type="number" id="cantidadTotal" th:field="*{cantidadTotal}" class="form-control-custom" min="1" required>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="custom-input-group">
                            <label for="anioPublicacion"><i class="bi bi-calendar text-primary"></i> Año</label>
                            <input type="number" id="anioPublicacion" th:field="*{anioPublicacion}" class="form-control-custom">
                        </div>
                    </div>
                </div>

                <div class="custom-input-group">
                    <label for="descripcion"><i class="bi bi-text-paragraph text-primary"></i> Descripción / Resumen</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control-custom" rows="3"></textarea>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-3 mt-4 pt-2">
                    <a th:href="@{/libros}" class="btn-secondary-custom"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn-primary-custom"><i class="bi bi-check-circle"></i> Actualizar Cambios</button>
                </div>

            </form>

        </div>

    </main>
</body>
</html>

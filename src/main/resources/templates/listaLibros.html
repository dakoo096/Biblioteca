<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Libros</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >

    <style>
        body {
            background-color: #F4F7F6;
            font-family: 'Segoe UI', sans-serif;
            color: #1F2933;
        }

        .hero {
            background: linear-gradient(135deg, #4F6D64, #3E5F57);
            border-radius: 0 0 24px 24px;
        }

        .hero h1 {
            color: #ffffff;
            font-weight: 600;
        }

        .hero img {
            width: 80px;
            height: 80px;
            filter: brightness(0) invert(1);
        }

        .btn-dark {
            background-color: #2F855A;
            border-color: #2F855A;
        }

        .btn-dark:hover {
            background-color: #276749;
            border-color: #276749;
        }

        .table {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead {
            background-color: #E6F0ED;
            color: #1F2933;
        }

        .pagination .page-link {
            color: #2F855A;
        }

        .pagination .page-item.active .page-link {
            background-color: #2F855A;
            border-color: #2F855A;
            color: #fff;
        }

        .pagination .page-link:hover {
            background-color: #E6F0ED;
        }

    </style>
</head>

<body>

<div class="hero text-center py-4 mb-4">
    <img src="img/biblioteca.svg" alt="Biblioteca" class="mb-2">
    <h1>Biblioteca virtual</h1>
</div>
<div class="container mb-3" th:if="${mensaje != null and !#strings.isEmpty(mensaje)}">
    <div
            class="alert alert-dismissible fade show"
            th:classappend="'alert-' + ${tipoMensaje}"
            role="alert"
    >
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div class="text-center mb-4">
    <a th:href="@{/nuevoLibro}" class="btn btn-dark btn-lg shadow">
        <img src="img/plus.png" alt="" class="me-2">
        Nuevo Libro
    </a>
</div>
<form th:action="@{/}" method="get"
      class="d-flex justify-content-center mb-4">

    <input
            type="text"
            name="q"
            class="form-control w-50 me-2"
            placeholder="Buscar por título o autor..."
            th:value="${q}"
    >
    <button class="btn btn-dark btn-lg shadow">
        🔍 Buscar
    </button>
</form>
<div
        class="text-center text-muted mt-4"
        th:if="${#lists.isEmpty(libros)}"
>
    📭 No se encontraron libros
</div>


<div class="container">
    <table class="table table-hover table-bordered shadow-sm">
        <thead>
        <tr>
            <th>ID</th>
            <th>TÍTULO</th>
            <th>AUTOR</th>
            <th>ISBN</th>
            <th class="text-center">ACCIONES</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr th:each="libro : ${libros}">
            <td th:text="${libro.idLibro}"></td>
            <td th:text="${#strings.abbreviate(libro.titulo, 30)}"></td>
            <td th:text="${libro.autor}"></td>
            <td th:text="${libro.isbn}"></td>

            <td class="text-center">
                <a th:href="@{/libro/{id}(id=${libro.idLibro})}" class="btn btn-outline-secondary btn-sm">
                    👁 Ver
                </a>
                <a
                        th:href="@{/editarLibro/{id}(id=${libro.idLibro})}"
                        class="btn btn-outline-primary btn-sm me-2"
                >
                    ✏️ Editar
                </a>
                <a
                        th:href="@{/eliminarLibro/{id}(id=${libro.idLibro})}"
                        class="btn btn-outline-danger btn-sm"
                        onclick="return confirm('¿Seguro que deseas eliminar este libro?')"
                >
                    🗑 Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<!-- Selector de tamaño -->
<form th:if="${q == null or #strings.isEmpty(q)}"
      method="get"
      th:action="@{/}"
      class="d-flex justify-content-center align-items-center gap-2 my-4">

    <label class="text-muted mb-0">Mostrar</label>

    <select name="size"
            class="form-select w-auto shadow-sm"
            onchange="this.form.submit()">
        <option value="5"  th:selected="${size == 5}">5</option>
        <option value="10" th:selected="${size == 10}">10</option>
        <option value="20" th:selected="${size == 20}">20</option>
    </select>

    <span class="text-muted">por página</span>
</form>

<!-- Paginación -->
<nav th:if="${buscando == null}" class="mt-4">
    <ul class="pagination justify-content-center shadow-sm">

        <li class="page-item"
            th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/(page=${currentPage - 1}, size=${size})}">
                ⬅ Anterior
            </a>
        </li>

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:href="@{/(page=${i}, size=${size}, q=${q})}"
               th:text="${i + 1}">
            </a>
        </li>

        <li class="page-item"
            th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/(page=${currentPage + 1}, size=${size})}">
                Siguiente ➡
            </a>
        </li>

    </ul>
</nav>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
></script>

</body>
</html>

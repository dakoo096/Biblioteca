<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SaaS - Registrar Préstamo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="../static/css/custom.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/}">
                <div class="brand-logo-wrapper"><i class="bi bi-bank"></i></div>
                <div>
                    <span class="brand-title d-block">Biblioteca SaaS</span>
                    <small class="text-muted d-block" style="font-size: 0.75rem; margin-top: -3px;">Gestión Bibliotecaria</small>
                </div>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/prestamos}" class="btn-secondary-custom"><i class="bi bi-arrow-left"></i> Volver a préstamos</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="form-card">
            
            <div class="form-header">
                <div class="form-header-icon" style="background: #e0f2fe; color: #0284c7;">
                    <i class="bi bi-arrow-left-right"></i>
                </div>
                <h2>Registrar Salida de Libro</h2>
                <p>Asigna un libro del inventario a un usuario registrado.</p>
            </div>

            <form th:action="@{/prestamos/guardar}" th:object="${prestamo}" method="post">

                <!-- Libro Selector -->
                <div class="custom-input-group">
                    <label for="libroId"><i class="bi bi-journal-text text-primary"></i> Seleccionar Libro</label>
                    <select id="libroId" th:field="*{libroId}" class="form-select form-control-custom" required>
                        <option value="">-- Selecciona un libro --</option>
                        <option th:each="lib : ${libros}" 
                                th:value="${lib.id}" 
                                th:text="${lib.titulo} + ' (Disponibles: ' + ${lib.cantidadDisponible} + ' / ' + ${lib.cantidadTotal} + ')'"
                                th:disabled="${!lib.disponible}">
                        </option>
                    </select>
                </div>

                <!-- Usuario Selector -->
                <div class="custom-input-group">
                    <label for="usuarioId"><i class="bi bi-person text-primary"></i> Seleccionar Usuario / Lector</label>
                    <select id="usuarioId" th:field="*{usuarioId}" class="form-select form-control-custom" required>
                        <option value="">-- Selecciona un usuario --</option>
                        <option th:each="usr : ${usuarios}" 
                                th:value="${usr.id}" 
                                th:text="${usr.nombreCompleto} + ' (' + ${usr.email} + ')'">
                        </option>
                    </select>
                </div>

                <!-- Fecha Límite -->
                <div class="custom-input-group">
                    <label for="fechaLimite"><i class="bi bi-calendar-event text-primary"></i> Fecha Límite de Devolución</label>
                    <input type="date" id="fechaLimite" th:field="*{fechaLimite}" class="form-control-custom" required>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-3 mt-4 pt-2">
                    <a th:href="@{/prestamos}" class="btn-secondary-custom"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn-primary-custom"><i class="bi bi-check-circle"></i> Otorgar Préstamo</button>
                </div>

            </form>

        </div>

    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SaaS - Iniciar Sesión</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Design System -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="../static/css/custom.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center bg-light">

    <div class="container" style="max-width: 440px;">
        <!-- Header Logo -->
        <div class="text-center mb-4">
            <div class="brand-logo-wrapper mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
                <i class="bi bi-bank"></i>
            </div>
            <h2 class="h3 fw-bold text-dark mb-1">Biblioteca SaaS</h2>
            <p class="text-muted fs-6">Ingresa con tus credenciales de acceso</p>
        </div>

        <!-- Card Form -->
        <div class="form-card p-4 shadow-sm border-0 bg-white" style="border-radius: var(--radius-lg);">
            
            <!-- Toast messages -->
            <div th:if="${errorMessage}" class="toast-alert toast-alert-error mb-3">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${errorMessage}">Credenciales incorrectas</span>
            </div>
            <div th:if="${successMessage}" class="toast-alert toast-alert-success mb-3">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <span th:text="${successMessage}">Operación realizada</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-bold">Correo Electrónico</label>
                    <div class="search-box max-w-100" style="max-width: 100%;">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="username" name="username" class="form-control" placeholder="ejemplo@biblioteca.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Contraseña</label>
                    <div class="search-box max-w-100" style="max-width: 100%;">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2 fs-6 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="text-muted mb-0">¿No tienes cuenta de lector? 
                    <a th:href="@{/registro}" class="text-primary fw-semibold text-decoration-none">Regístrate aquí</a>
                </p>
            </div>
        </div>

        <!-- Demo Accounts Hint Card -->
        <div class="mt-4 p-3 bg-white border rounded-3 text-muted text-center" style="font-size: 0.85rem; border-radius: var(--radius-md)!important;">
            <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle text-primary"></i> Cuentas Demo de Prueba:</div>
            <div><strong>👑 Admin:</strong> admin@biblioteca.com / <code>admin123</code></div>
            <div><strong>📖 Lector:</strong> ana.garcia@email.com / <code>lector123</code></div>
        </div>

        <!-- Theme Toggle Button -->
        <div class="text-center mt-3">
            <button id="themeToggleBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="bi bi-moon-stars-fill me-1"></i> Modo Oscuro
            </button>
        </div>
    </div>

    <script>
        (function() {
            function initPage() {
                const themeBtn = document.getElementById('themeToggleBtn');
                if (themeBtn) {
                    function updateBtn(theme) {
                        if (theme === 'dark') {
                            document.documentElement.setAttribute('data-theme', 'dark');
                            localStorage.setItem('theme', 'dark');
                            themeBtn.innerHTML = '<i class="bi bi-sun-fill me-1 text-warning"></i> Modo Claro';
                        } else {
                            document.documentElement.removeAttribute('data-theme');
                            localStorage.setItem('theme', 'light');
                            themeBtn.innerHTML = '<i class="bi bi-moon-stars-fill me-1"></i> Modo Oscuro';
                        }
                    }

                    const currentTheme = localStorage.getItem('theme') || (document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
                    updateBtn(currentTheme);

                    themeBtn.onclick = function() {
                        let isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                        updateBtn(isDark ? 'light' : 'dark');
                    };
                }

                initToastAlerts();
            }

            function initToastAlerts() {
                const alerts = document.querySelectorAll('.toast-alert');
                alerts.forEach(alert => {
                    if (!alert.querySelector('.toast-dismiss-btn')) {
                        const closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'toast-dismiss-btn';
                        closeBtn.innerHTML = '&times;';
                        closeBtn.setAttribute('aria-label', 'Cerrar');
                        closeBtn.onclick = () => dismissToast(alert);
                        alert.appendChild(closeBtn);
                    }

                    setTimeout(() => {
                        dismissToast(alert);
                    }, 4000);
                });
            }

            function dismissToast(alert) {
                if (!alert || alert.classList.contains('toast-dismissing')) return;
                alert.classList.add('toast-dismissing');
                setTimeout(() => {
                    if (alert.parentNode) alert.parentNode.removeChild(alert);
                }, 350);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initPage);
            } else {
                initPage();
            }
        })();
    </script>
</body>
</html>
